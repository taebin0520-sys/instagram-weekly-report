<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  데이터 보호를 "약속"이 아니라 브라우저가 강제하게 한다 (requirements R4.5, design §6).
  connect-src 'none' : 이 페이지의 스크립트는 어떤 서버로도 데이터를 보낼 수 없다.
  script-src 'self'  : 이 사이트의 report.js·app.js 만 실행된다 (외부 CDN·인라인 스크립트 불가).
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:; font-src 'none'; form-action 'none'; base-uri 'none'">
<title>아벤투라 인스타 주간 리포트</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         font-size: 16px; line-height: 1.5; color: #222; margin: 0 auto; max-width: 760px; padding: 1rem; }
  h1 { font-size: 1.3rem; margin: .5rem 0; }
  .notice { background: #eef6ee; border: 1px solid #9ccc9c; border-radius: 6px; padding: .6rem .8rem; margin-bottom: 1rem; }
  .step { font-weight: 700; margin: 1.2rem 0 .4rem; }
  textarea { width: 100%; min-height: 8rem; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: .5rem; }
  button, .file-label { font-size: 1rem; padding: .6rem 1rem; border-radius: 6px; border: 1px solid #555;
                        background: #fff; cursor: pointer; display: inline-block; margin: .3rem .3rem .3rem 0; }
  button.primary { background: #2f6f3e; color: #fff; border-color: #2f6f3e; }
  input[type=file] { font-size: 1rem; max-width: 100%; }
  .status { color: #555; font-size: .95rem; min-height: 1.4em; }
  .error { background: #fdecec; border: 2px solid #c0392b; border-radius: 6px; padding: .6rem .8rem; margin-top: 1rem; }
  .error h2 { font-size: 1.05rem; margin: 0 0 .3rem; color: #a02a1e; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 16px/1.5 inherit; font-family: inherit; margin: 0; }
  .result { border: 1px solid #bbb; border-radius: 6px; padding: .8rem; margin-top: 1rem; background: #fafafa; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>아벤투라 인스타 주간 리포트</h1>
  <p class="notice">입력한 데이터는 이 브라우저 밖으로 전송되지 않습니다. 새로고침하면 모두 사라집니다.</p>

  <p class="step">1. CSV 파일을 고르거나, 엑셀 표를 복사해 아래 칸에 붙여넣으세요</p>
  <input type="file" id="file" accept=".csv,.tsv,.txt,text/csv">
  <p class="status" id="file-status"></p>
  <textarea id="input" placeholder="date	type	topic	reach	likes	comments	saves	shares	profile_visits	dm_inquiries	signups" spellcheck="false"></textarea>
  <button type="button" class="primary" id="run">리포트 만들기</button>

  <section class="error" id="error" hidden>
    <h2 id="error-title">리포트를 만들지 않았습니다</h2>
    <pre id="error-text"></pre>
  </section>

  <section class="result" id="result" hidden>
    <p class="step" style="margin-top:0">2. 결과를 복사해 카카오톡·노션에 붙여넣으세요</p>
    <button type="button" class="primary" id="copy">리포트 복사</button>
    <span class="status" id="copy-status"></span>
    <pre id="report"></pre>
  </section>

  <script src="report.js"></script>
  <script src="app.js"></script>
</body>
</html>
