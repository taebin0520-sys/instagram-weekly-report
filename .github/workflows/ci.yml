name: CI

# main 으로의 push 와 모든 PR 에서 테스트를 돌린다.
# PR 에서 돌아야 "수정이 기존 테스트를 깼는지"를 머지 전에 확인할 수 있다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치 (버전 고정)
        run: pip install -r requirements.txt

      - name: 설치된 버전 확인
        run: |
          python --version
          pip list

      - name: pytest 실행
        run: pytest -v
