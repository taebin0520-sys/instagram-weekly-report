name: CI

# main 으로의 push 와 모든 PR 에서 테스트를 돌린다.
# PR 에서 돌아야 "수정이 기존 테스트를 깼는지"를 머지 전에 확인할 수 있다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치 (버전 고정)
        run: pip install -r requirements.txt

      - name: 설치된 버전 확인
        run: |
          python --version
          pip list

      - name: pytest 실행
        run: pytest -v

      # pytest 가 검증하는 3개 함수는 pandas 를 쓰지 않는다.
      # 즉 add_rates / split_by_week / topic_summary / build_weekly_report 같은
      # pandas 의존 경로는 pytest 만으로는 한 번도 실행되지 않는다.
      # 실제로 리포트가 생성되는지 확인하려면 진입점을 직접 돌려봐야 한다.
      - name: smoke 테스트 — 리포트 생성 (출력 전문)
        run: python main.py sample_data/instagram_posts.csv
