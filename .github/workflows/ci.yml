name: CI

# main 으로의 push 와 모든 PR 에서 테스트를 돌린다.
# PR 에서 돌아야 "수정이 기존 테스트를 깼는지"를 머지 전에 확인할 수 있다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치 (버전 고정)
        run: pip install -r requirements.txt

      - name: 설치된 버전 확인
        run: |
          python --version
          pip list

      - name: pytest 실행
        run: pytest -v

      # pytest 가 검증하는 3개 함수는 pandas 를 쓰지 않는다.
      # 즉 add_rates / split_by_week / topic_summary / build_weekly_report 같은
      # pandas 의존 경로는 pytest 만으로는 한 번도 실행되지 않는다.
      # 실제로 리포트가 생성되는지 확인하려면 진입점을 직접 돌려봐야 한다.
      - name: smoke 테스트 — 리포트 생성 (출력 전문)
        run: python main.py sample_data/instagram_posts.csv

      # 리포트 로직을 바꾸고 데모 페이지를 다시 안 만들면 Pages 가 옛 결과를 보여준다.
      # 다시 생성해서 커밋된 docs/index.html 과 다르면 실패시켜 알려준다.
      - name: 데모 페이지 최신 여부 확인
        run: |
          python render_html.py
          git diff --exit-code docs/index.html

      # 웹버전(docs/report.js)이 Python 과 같은 입력을 같은 이유로 거부하는지 비교한다.
      # npm 패키지를 쓰지 않으므로 npm install · 캐시 단계가 없다 (requirements R5.4).
      - name: Node 22 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 웹버전 비교 — 입력 검증 (Python vs Node)
        run: bash web/compare.sh
